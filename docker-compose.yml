services:
  initial-report-bot:
    build: .
    container_name: initial-report-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
    networks:
      - bot-net
    expose:
      - "8080"

networks:
  bot-net:
    external: true
